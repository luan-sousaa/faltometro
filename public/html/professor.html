<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> Espaço - Professor </title>
  <link rel="stylesheet" href="/public/css/styleprofessor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>
 
  <div class="container">

  
    <div class="topbar">
      <div class="notificacoes">
        <img class="notificacoes" src="/public/img/sino.png" alt="">
      </div>
      <div class="perfil">
        <img src="https://e7.pngegg.com/pngimages/781/687/png-clipart-refilmery-computer-icons-avatar-user-profile-avatar-heroes-rim.png" alt="Foto">
      </div>
    </div>

   
    <p class="welcome">Seja bem-vindo, Professor!</p>

   
    <div class="filters">
      <div class="filter-box">
        <label for="turma"></label>
        <select id="turma">
          <option value="">Turma:</option>
          <option value=""></option>
          <option value=""></option>
          <option value=""></option>
        </select>
      </div>

      <div class="filter-box">
        <label for="data"></label>
        <input type="date" id="data">
      </div>

      <div class="filter-box">
        <label for="materia"></label>
        <select id="materia">
          <option value="">Matéria:</option>
          <option value=""></option>
          <option value=""></option>
          <option value=""></option>
          <option value=""></option>
        </select>
      </div>
    </div>

    
    <table>
      <thead>
        <tr>
          <th>Aluno</th>
          <th>Presença</th>
          <th>Nota</th>
          <th>Observações</th>
        </tr>
      </thead>
      <tbody>
        <tr class="tam"><td></td><td></td><td></td><td></td></tr>
        <tr class="tam"><td></td><td></td><td></td><td></td></tr>
        <tr class="tam"><td></td><td></td><td></td><td></td></tr>
        <tr class="tam"><td></td><td></td><td></td><td></td></tr>
        <tr class="tam"><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Espaço - Aluno</title>
  <link rel="stylesheet" href="/css/stylealuno.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <div class="topbar">
      <div class="notificacoes"><img class="notificacoes" src="/img/sino.png" alt=""></div>
      <div class="perfil"><img src="https://e7.pngegg.com/pngimages/781/687/png-clipart-refilmery-computer-icons-avatar-user-profile-avatar-heroes-rim.png" alt="Foto"></div>
    </div>

    <p class="welcome">Seja bem-vindo, Aluno!</p>

    <div class="infos">
      <div>R.A:</div>
      <div>Curso:</div>
      <div>Período:</div>
    </div>

    <table>
      <tr>
        <th>Matéria</th>
        <th>Carga Horária</th>
        <th>Faltas</th>
        <th>Situação</th>
      </tr>
      <tr class="tam"><td></td><td></td><td></td><td></td></tr>
      <tr class="tam"><td></td><td></td><td></td><td></td></tr>
      <tr class="tam"><td></td><td></td><td></td><td></td></tr>
      <tr class="tam"><td></td><td></td><td></td><td></td></tr>
      <tr class="tam"><td></td><td></td><td></td><td></td></tr>
    </table>

    <div class="legenda">
      <span><span class="dot verde"></span> Ótima</span>
      <span><span class="dot amarelo"></span> Ok</span>
      <span><span class="dot laranja"></span> Preocupante</span>
      <span><span class="dot vermelho"></span> Crítica</span>
    </div>

  </div>
</body>
</html>
